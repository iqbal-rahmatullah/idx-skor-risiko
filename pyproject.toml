[project]
name = "skor-risiko"
version = "0.1.0"
description = "Bot Telegram yang menilai risiko saham IDX dari 28 indikator untuk investor pemula."
readme = "README.md"
license = "MIT"
authors = [{ name = "Iqbal Rahmatullah" }]
requires-python = ">=3.11"
keywords = [
    "idx",
    "indonesia-stock-exchange",
    "saham",
    "stock-market",
    "risk-analysis",
    "telegram-bot",
    "llm",
    "fintech",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Indonesian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "certifi",
    "httpx>=0.28",
    "openai>=3.19,<4",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-telegram-bot[job-queue,rate-limiter]>=22,<23",
    "sqlalchemy>=2",
]

[project.urls]
Homepage = "https://skor-risiko.pages.dev"
Documentation = "https://skor-risiko.pages.dev/docs/"
Repository = "https://github.com/iqbal-rahmatullah/idx-skor-risiko"
Issues = "https://github.com/iqbal-rahmatullah/idx-skor-risiko/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
