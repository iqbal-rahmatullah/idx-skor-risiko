[project]
name = "skor-risiko"
version = "0.1.0"
description = "Bot Telegram yang menilai risiko saham IDX dari 28 indikator untuk investor pemula."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "httpx>=0.28",
    "openai>=3.19,<4",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-telegram-bot[job-queue,rate-limiter]>=22,<23",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
