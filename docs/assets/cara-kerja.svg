<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" fill="none" role="img" aria-labelledby="judul desk">
  <title id="judul">Cara kerja Skor Risiko</title>
  <desc id="desk">Pemicu dari /risk, /regis, atau putaran 06.00 WIB membuat snapshot data dari Sectors API dan BEI. Mesin aturan menghitung 28 indikator, skor, dan grade ke indicators.json. AI menulis narasi untuk pemula, gerbang angka membuang angka karangan dan ajakan beli atau jual, lalu kartu dikirim ke topik Telegram untuk investor. Kalau AI gagal atau terlambat, kartu cadangan tanpa AI yang dikirim.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 12px; letter-spacing: 3px; fill: #34d399; }
    .headline { font-size: 22px; font-weight: 700; fill: #edf1f6; }
    .num { font-size: 12px; fill: #ffffff; fill-opacity: 0.32; }
    .title { font-size: 15px; font-weight: 600; fill: #edf1f6; }
    .title.mono { font-size: 14px; }
    .sub { font-size: 12px; fill: #8c97a8; }
    .note { font-size: 12px; }
    .tiny { font-size: 11px; fill: #ffffff; fill-opacity: 0.4; }
    .flow { stroke-dasharray: 28 72; animation: flow 1.6s linear infinite; }
    .glow { opacity: 0; animation: glow 6.4s ease-in-out infinite; }
    .blink { animation: blink 3.2s ease-in-out infinite; }
    .fallback { stroke-dasharray: 6 7; animation: march 1.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
    @keyframes glow { 0%, 16%, 100% { opacity: 0; } 5%, 11% { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes march { to { stroke-dashoffset: -13; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .glow, .blink, .fallback { animation: none; }
      .flow { stroke-dasharray: none; stroke-opacity: 0.45; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect width="1000" height="560" rx="28"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
    <radialGradient id="glowA" cx="0.12" cy="0" r="0.75"><stop offset="0" stop-color="#10b981" stop-opacity="0.28"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.6"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="0.6"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1.5 1.5 8 5 1.5 8.5" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1.5 1.5 8 5 1.5 8.5" stroke="#fcd34d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="560" fill="#05070a"/>
    <rect width="1000" height="560" fill="url(#grid)"/>
    <rect width="1000" height="560" fill="url(#glowA)"/>
    <rect width="1000" height="560" fill="url(#glowB)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="559" rx="27.5" stroke="#ffffff" stroke-opacity="0.12"/>

  <text class="eyebrow mono" x="48" y="58">CARA KERJA</text>
  <text class="headline" x="48" y="92">Kode menghitung semua angka. AI hanya menjelaskan.</text>

