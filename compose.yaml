name: skor-risiko

services:
  bot:
    build: .
    image: skor-risiko
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/skor-risiko.db
    volumes:
      - data:/data
    network_mode: bridge
    extra_hosts:
      - host.docker.internal:host-gateway
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
